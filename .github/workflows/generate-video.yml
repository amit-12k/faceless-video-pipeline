name: Generate faceless video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to explain in the video (may be left blank when resuming)
        required: false
        type: string
      style:
        description: Editorial style
        required: true
        type: choice
        options: [explainer, documentary, myth-busting, practical]
      language:
        description: Narration language (for example, English or Hindi)
        required: true
        default: English
        type: string
      presenter:
        description: Show the animated robot presenter
        required: false
        default: true
        type: boolean
      resume_from_run:
        description: Optional run ID to reuse that run's research, script, and narration and only re-render
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: video-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Research, narrate, and render
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      VIDEO_TOPIC: ${{ inputs.topic }}
      VIDEO_STYLE: ${{ inputs.style }}
      VIDEO_LANGUAGE: ${{ inputs.language }}
      OUTPUT_DIR: artifacts/${{ github.run_id }}
      RESUME: ${{ inputs.resume_from_run != '' }}
      VIDEO_MASCOT: ${{ inputs.presenter && 'on' || 'off' }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-3.8-flash-lite-tts
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg, fonts, and headless Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 \
            libpango-1.0-0 libatk-bridge2.0-0

      - name: Install dependencies
        run: npm ci

      - name: Cache whisper.cpp and its speech models
        uses: actions/cache@v4
        with:
          path: ~/.cache/faceless-whisper
          key: whisper-cpp-1.5.5-base-${{ runner.os }}

      - name: Download the earlier run's files to resume from
        if: ${{ inputs.resume_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: faceless-video-${{ inputs.resume_from_run }}
          path: ${{ env.OUTPUT_DIR }}
          run-id: ${{ inputs.resume_from_run }}
          github-token: ${{ github.token }}

      - name: Check workflow code
        run: npm run check && npm test

      - name: Generate and validate video
        run: node src/index.mjs

      - name: Upload job files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faceless-video-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
