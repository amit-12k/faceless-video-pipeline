name: Generate faceless video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to explain in the video
        required: true
        type: string
      style:
        description: Editorial style
        required: true
        type: choice
        options: [explainer, documentary, myth-busting, practical]
      language:
        description: Narration language (for example, English or Hindi)
        required: true
        default: English
        type: string

permissions:
  contents: read

concurrency:
  group: video-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Research, narrate, and render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VIDEO_TOPIC: ${{ inputs.topic }}
      VIDEO_STYLE: ${{ inputs.style }}
      VIDEO_LANGUAGE: ${{ inputs.language }}
      OUTPUT_DIR: artifacts/${{ github.run_id }}
      GEMINI_TEXT_MODEL: gemini-2.5-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-lite-tts
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Check workflow code
        run: npm run check

      - name: Generate and validate video
        run: node src/index.mjs

      - name: Upload job files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faceless-video-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
